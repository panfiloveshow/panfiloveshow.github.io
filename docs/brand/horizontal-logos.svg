<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 100" fill="none" role="img" aria-label="МИР, СБП, Visa, Mastercard, PayKeeper">

  <!-- МИР -->
  <g>
    <!-- зелёный фон -->
    <rect x="0" y="10" width="220" height="80" rx="14" fill="#00A651"/>
    <!-- светлый блик сверху -->
    <rect x="0" y="10" width="220" height="38" rx="14" fill="url(#mir-glare)"/>
    <defs>
      <linearGradient id="mir-glare" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- текст МИР -->
    <text x="110" y="57" font-family="'Arial Black', 'Arial', sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">МИР</text>
    <!-- маленькая надпись платёжная система -->
    <text x="110" y="79" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1">ПЛАТЁЖНАЯ СИСТЕМА</text>
  </g>

  <!-- СБП -->
  <g transform="translate(256, 0)">
    <rect x="0" y="10" width="200" height="80" rx="14" fill="#1C2C5E"/>
    <rect x="0" y="10" width="200" height="38" rx="14" fill="url(#sbp-glare)"/>
    <defs>
      <linearGradient id="sbp-glare" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- молния / стилизованная С -->
    <path d="M62 28 L50 50 L60 50 L48 74 L74 46 L62 46 L74 28 Z"
          fill="url(#sbp-bolt)"/>
    <defs>
      <linearGradient id="sbp-bolt" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFD000"/>
        <stop offset="50%" stop-color="#F05A28"/>
        <stop offset="100%" stop-color="#ED1C24"/>
      </linearGradient>
    </defs>
    <!-- текст СБП -->
    <text x="120" y="55" font-family="'Arial Black', 'Arial', sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">СБП</text>
    <text x="120" y="76" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="0.5">БЫСТРЫЕ ПЛАТЕЖИ</text>
  </g>

  <!-- Visa -->
  <g transform="translate(500, 0)">
    <rect x="0" y="10" width="200" height="80" rx="14" fill="white"/>
    <rect x="0" y="10" width="200" height="80" rx="14" fill="none" stroke="rgba(0,0,0,0.10)" stroke-width="1.5"/>
    <!-- VISA text -->
    <text x="100" y="58" font-family="'Arial', sans-serif" font-size="42" font-weight="900" font-style="italic" fill="#1A1F71" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">VISA</text>
  </g>

  <!-- Mastercard -->
  <g transform="translate(744, 0)">
    <!-- левый красный круг -->
    <circle cx="74" cy="50" r="40" fill="#EB001B"/>
    <!-- правый жёлтый круг -->
    <circle cx="118" cy="50" r="40" fill="#F79E1B"/>
    <!-- перекрытие — оранжевый -->
    <path d="M96 16.6 A40 40 0 0 1 96 83.4 A40 40 0 0 1 96 16.6 Z" fill="#FF5F00" opacity="0.85"/>
    <!-- надпись внизу -->
    <text x="96" y="91" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1">MASTERCARD</text>
  </g>

  <!-- PayKeeper -->
  <g transform="translate(988, 0)">
    <rect x="0" y="10" width="230" height="80" rx="14" fill="#F26522"/>
    <rect x="0" y="10" width="230" height="38" rx="14" fill="url(#pk-glare)"/>
    <defs>
      <linearGradient id="pk-glare" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- Flame / иконка -->
    <path d="M36 72 C32 65 28 58 34 48 C34 48 34 56 40 54 C36 48 42 38 50 30 C48 40 54 44 52 52 C56 48 57 42 56 36 C62 44 64 54 60 62 C66 56 66 48 62 40 C68 50 70 60 64 70 C70 62 70 54 67 46 C73 56 74 66 70 74 C70 74 36 72 36 72 Z"
          fill="white" opacity="0.9"/>
    <!-- текст -->
    <text x="135" y="53" font-family="'Arial Black', 'Arial', sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="-0.5">PayKeeper</text>
    <text x="135" y="74" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="0.5">ЭКВАЙРИНГ</text>
  </g>

</svg>
