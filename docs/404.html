<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Страница не найдена — Sellico</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f8f6;
        color: #101a15;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 620px; }
      p { color: #5b6a62; font-size: 17px; line-height: 1.65; }
      .label { color: #177357; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 18px 0 0; font-size: clamp(42px, 8vw, 72px); line-height: 1; letter-spacing: -.05em; }
      a {
        display: inline-block;
        margin-top: 24px;
        border-radius: 12px;
        background: #177357;
        padding: 14px 22px;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Ошибка 404</div>
      <h1>Такой страницы нет</h1>
      <p>Проверьте адрес или вернитесь на главную страницу Sellico.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
