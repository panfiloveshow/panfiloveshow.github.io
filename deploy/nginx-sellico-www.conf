# Добавьте этот return в существующий HTTP- и HTTPS-server для www.sellico.ru.
# TLS-server должен использовать сертификат, в который включён www.sellico.ru.
# Конфигурация намеренно не содержит путей к сертификату: они зависят от сервера.

server {
    listen 80;
    listen [::]:80;
    server_name www.sellico.ru;

    return 301 https://sellico.ru$request_uri;
}

