# Отдача статики лендинга Sellico (содержимое dist).
# Подставьте в server-блок сайта. Ключевое — try_files с $uri/: без него
# /wildberries/ и /calculators/unit-economics/ вернут 404, хотя файлы на месте.

root /var/www/html/landing/dist;
index index.html;

# Канонический вид адреса — со слэшем на конце: /wildberries → /wildberries/
# Без редиректа обе версии отдают одну страницу, и это дубли для поисковика.
location ~ ^(/.*[^/])$ {
    if (-d $document_root$1) {
        return 301 $1/;
    }
    try_files $uri $uri/ =404;
}

location / {
    try_files $uri $uri/ =404;
}

# Ассеты собираются с хешем в имени — можно кэшировать надолго.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# HTML кэшировать нельзя: иначе после деплоя пользователи видят старую разметку
# со ссылками на удалённые чанки.
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

location = /sitemap.xml {
    expires 1h;
    add_header Cache-Control "public";
}

location = /robots.txt {
    expires 1h;
    add_header Cache-Control "public";
}

error_page 404 /404.html;
location = /404.html {
    internal;
}
