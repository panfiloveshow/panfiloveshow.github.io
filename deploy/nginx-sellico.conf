# Отдача статики лендинга Sellico (содержимое dist).
# Подставьте в server-блок сайта. Ключевое — try_files с $uri/: без него
# /wildberries/ и /calculators/unit-economics/ вернут 404, хотя файлы на месте.
# Для отдельного server-блока www используйте nginx-sellico-www.conf: www всегда
# должен перенаправлять на канонический https://sellico.ru$request_uri.

root /var/www/html/landing/dist;
index index.html;

# Базовые защитные заголовки. CSP сначала включена в Report-Only:
# после проверки отчётов её следует перевести в Content-Security-Policy.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru https://yandex.ru; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://mc.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Дубли index.html склеиваем с корнем. Markdown остаётся альтернативным форматом,
# но не конкурирует с канонической HTML-страницей тарифов в поиске.
location = / {
    try_files /index.html =404;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru https://yandex.ru; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://mc.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'; upgrade-insecure-requests" always;
}

location = /index.html {
    return 301 /;
}

location = /pricing.md {
    default_type text/markdown;
    charset utf-8;
    add_header Link '<https://sellico.ru/pricing/>; rel="canonical"' always;
    add_header X-Robots-Tag 'noindex, follow' always;
    try_files $uri =404;
}

location = /llms.txt {
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
}

location = /llms-full.txt {
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
}

location = /indexnow-key.txt {
    default_type text/plain;
    charset utf-8;
    add_header X-Robots-Tag 'noindex' always;
    try_files $uri =404;
}

location / {
    # Никакого fallback на /index.html: неизвестный URL обязан вернуть настоящий 404,
    # иначе поисковик видит главную страницу с кодом 200 (soft 404).
    try_files $uri $uri/ =404;
}

# Ассеты собираются с хешем в имени — можно кэшировать надолго.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# /about/index.html и аналоги — дубли чистых URL. Проверяем $request_uri (адрес из запроса),
# а не location: директива index сама делает внутренний переход на /about/index.html,
# и regex-location вернул бы его редиректом на /about/ — бесконечный цикл.
if ($request_uri ~ "^(?!//)([^?]*/)index\.html(\?.*)?$") {
    return 301 $1$2;
}

# HTML кэшировать нельзя: иначе после деплоя пользователи видят старую разметку
# со ссылками на удалённые чанки.
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru https://yandex.ru; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://mc.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'; upgrade-insecure-requests" always;
    try_files $uri =404;
}

# Канонический вид каталога — со слэшем: /wildberries → /wildberries/.
# Правило стоит после HTML-regex, чтобы не перехватывать его кэш-заголовки.
location ~ ^(/.*[^/])$ {
    if (-d $document_root$1) {
        return 301 $1/;
    }
    try_files $uri $uri/ =404;
}

location = /sitemap.xml {
    expires 1h;
    add_header Cache-Control "public";
}

location = /robots.txt {
    expires 1h;
    add_header Cache-Control "public";
}

error_page 404 /404.html;
location = /404.html {
    internal;
}
