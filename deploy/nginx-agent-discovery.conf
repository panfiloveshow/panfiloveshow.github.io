# Include inside the landing server {}, before its regex locations.
# Install as /etc/nginx/snippets/sellico-agent-discovery.conf.
# No http-level maps or extra nginx modules are required.
set $sellico_accept_markdown 0;
if ($http_accept ~* "(?:^|,)\s*text/markdown(?=\s*(?:;|,|$))(?![^,]*;\s*q=0(?:\.0*)?\s*(?:;|,|$))(?![^,]*;\s*q=(?!(?:0(?:\.[0-9]{0,3})?|1(?:\.0{0,3})?)\s*(?:;|,|$)))") {
    set $sellico_accept_markdown 1;
}
error_page 418 = @sellico_markdown;

location @sellico_markdown {
    # index can cause an internal redirect to /section/index.html.
    rewrite ^(.*)/index\.html$ $1/ break;
    types { }
    default_type text/markdown;
    charset utf-8;
    add_header Vary Accept always;
    add_header Link '<https://sellico.ru$uri>; rel="canonical", </.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc", </agents.md>; rel="service-doc", </llms.txt>; rel="llms", </.well-known/mcp/server-card.json>; rel="mcp-server-card", </.well-known/agent-card.json>; rel="agent-card"' always;
    add_header X-Robots-Tag 'noindex, follow' always;
    add_header Cache-Control 'no-cache' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload' always;
    try_files ${uri}index.md ${uri}/index.md =404;
}

# Uppercase /AGENTS.md and /.well-known/AGENTS.md aliases for standard agent probes.
location = /AGENTS.md {
    types { }
    default_type text/markdown;
    charset utf-8;
    add_header Access-Control-Allow-Origin '*' always;
    add_header X-Robots-Tag 'noindex, follow' always;
    add_header Cache-Control 'no-cache' always;
    add_header X-Content-Type-Options nosniff always;
    try_files /AGENTS.md /agents.md =404;
}

location = /.well-known/AGENTS.md {
